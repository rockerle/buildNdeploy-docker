name: 'Rebuild and Restart a Docker Container'
description: 'Test Github action for me that replaces a running docker container with an updated image'
inputs:
  imagename:
    description: 'Name of the docker image'
    required: false
    default: 'default-iName:latest'
  containername:
    description: 'Name of the docker container that gets deployed'
    required: false
    default: 'default-cName'
  dnetwork:
    description: 'name of the docker network the container should be added to'
    required: false
    default: ''
  restartpolicy:
    description: 'Docker restart policy for the container'
    required: false
    default: unless-stopped
  label:
    description: 'Adding docker label to the docker container in form of a label file'
    required: false
    default: ''
  env:
    description: 'Environment Variables passed to the docker run command'
    required: false
    default: ''
runs:
    using: 'composite'
    steps:
        - run: $GITHUB_ACTION_PATH/entrypoint.sh
          shell: bash
          env:
            INPUT_IMAGENAME: ${{inputs.imagename}}
            INPUT_CONTAINERNAME: ${{inputs.containername}}
            INPUT_RESTARTPOLICY: ${{inputs.restartpolicy}}
            INPUT_DNETWORK: ${{inputs.dnetwork}}
            INPUT_LABEL: ${{inputs.label}}
            INPUT_ENV: ${{inputs.env}}
